# Cloudflare Worker: JSON-API unter /api/* plus Auslieferung der statischen Seiten.
name = "prayer-times-map"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[vars]
# Nominatim verlangt einen erkennbaren User-Agent. Gern um eine Kontakt-URL ergänzen,
# z. B. "prayer-times-map/1.0 (+https://deine-domain.example)".
NOMINATIM_USER_AGENT = "prayer-times-map/1.0 (+https://prayer-times-map.salah-times.workers.dev)"

[assets]
directory = "."
binding = "ASSETS"
# /api/* geht immer zuerst an den Worker (sonst würde /api/times auf times.html gemappt)
run_worker_first = ["/api", "/api/*"]
