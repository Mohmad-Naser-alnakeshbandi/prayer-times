# Prüft regelmäßig, ob die Live-API erreichbar ist und korrekt rechnet.
# Der Status erscheint als Badge in den READMEs.
name: Service health

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  workflow_dispatch:          # manuell im Tab "Actions" startbar
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://prayer-times-map.salah-times.workers.dev
    steps:
      # Nach einem Push kann der Deploy (z. B. über Cloudflare Workers Builds) noch laufen:
      # dann bis zu 5 Minuten auf eine gesunde Antwort warten, sonst nur kurz wiederholen.
      - name: Health endpoint
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then attempts=20; else attempts=3; fi
          for i in $(seq 1 "$attempts"); do
            body=$(curl -fsS "$BASE/api/health" || true)
            if [ "$(echo "$body" | jq -r '.data.status' 2>/dev/null)" = "ok" ]; then
              echo "$body" | jq .
              exit 0
            fi
            echo "Versuch $i/$attempts: noch nicht bereit – warte 15 s"
            sleep 15
          done
          echo "Health-Check fehlgeschlagen. Letzte Antwort:"
          echo "$body"
          exit 1

      - name: Prayer times endpoint
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 5 "$BASE/api/times?lat=21.4225&lon=39.8262&method=UMM_AL_QURA")
          echo "$body" | jq '.data.times'
          test "$(echo "$body" | jq -r .status)" = "200"
          test "$(echo "$body" | jq -r .data.times.dhuhr)" != "null"

      - name: Website
        run: curl -fsS -o /dev/null -H "Accept: text/html" "$BASE/"
